<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found &mdash; CF Focus</title>
  <script src="theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Light theme: the bright signal red. */
    :root {
      --red:      #c8191c;
      --red-deep: #8d1013;
      --red-lit:  #e8262a;
      --ink:      #12080a;
      --white:    #ffffff;
      /* Surfaces that sit on top of the red field (clock face, cards, ribbon) */
      --face:     #ffffff;
      --face-ink: #12080a;
      --face-sub: rgba(18,8,10,0.72);
      --mono: 'JetBrains Mono', ui-monospace, monospace;
      --sans: 'Inter', system-ui, sans-serif;
      --clock: 268px;
    }

    /* Dark theme: same red identity, dialled down to a deep ember so it isn't
       a wall of bright red at night. Surfaces go dark, text stays high-contrast. */
    :root[data-theme="dark"] {
      --red:      #7d1114;
      --red-deep: #3d0709;
      --red-lit:  #a81a1e;
      --ink:      #f5eaea;
      --face:     #171113;
      --face-ink: #ffffff;
      --face-sub: rgba(255,255,255,0.78);
    }

    html, body { min-height: 100%; }

    body {
      background: var(--red);
      color: var(--white);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ══ Animated red + white background ══════════════════════════════════════
       Three stacked layers, all behind the content:
         1. a slow red gradient wash that breathes
         2. two drifting soft white blobs
         3. wide diagonal white stripes scrolling past
       Everything here is decorative and non-interactive.                        */
    .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }

    .bg-wash {
      position: absolute; inset: -30%;
      background:
        radial-gradient(60% 55% at 20% 20%, var(--red-lit) 0%, transparent 60%),
        radial-gradient(55% 50% at 85% 75%, var(--red-deep) 0%, transparent 62%),
        linear-gradient(140deg, var(--red) 0%, var(--red-deep) 100%);
      animation: wash 22s ease-in-out infinite alternate;
    }
    @keyframes wash {
      from { transform: scale(1)    rotate(0deg); }
      to   { transform: scale(1.12) rotate(6deg); }
    }

    .bg-blob {
      position: absolute; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.30), rgba(255,255,255,0) 68%);
      filter: blur(6px);
    }
    .bg-blob.a { width: 620px; height: 620px; top: -180px; left: -160px;  animation: drift-a 26s ease-in-out infinite alternate; }
    .bg-blob.b { width: 520px; height: 520px; bottom: -200px; right: -140px; animation: drift-b 31s ease-in-out infinite alternate; }
    @keyframes drift-a {
      from { transform: translate3d(0,0,0)        scale(1); }
      to   { transform: translate3d(140px,90px,0) scale(1.18); }
    }
    @keyframes drift-b {
      from { transform: translate3d(0,0,0)          scale(1.1); }
      to   { transform: translate3d(-120px,-70px,0) scale(0.92); }
    }

    /* Wide flat diagonal stripes — the "ribbon" motif the buttons echo. */
    .bg-stripes {
      position: absolute; inset: -40%;
      background: repeating-linear-gradient(
        118deg,
        rgba(255,255,255,0.11) 0px,
        rgba(255,255,255,0.11) 46px,
        rgba(255,255,255,0)   46px,
        rgba(255,255,255,0)   132px
      );
      animation: stripes 30s linear infinite;
    }
    @keyframes stripes {
      from { transform: translate3d(0,0,0); }
      to   { transform: translate3d(-264px, 0, 0); }
    }

    /* Fine grain so the flat red doesn't band on large displays. */
    .bg-grain {
      position: absolute; inset: 0; opacity: 0.30; mix-blend-mode: overlay;
      background-image: repeating-linear-gradient(0deg,
        rgba(255,255,255,0.05) 0 1px, rgba(0,0,0,0) 1px 3px);
    }

    @media (prefers-reduced-motion: reduce) {
      .bg-wash, .bg-blob, .bg-stripes { animation: none; }
    }

    /* ══ Content ═════════════════════════════════════════════════════════════ */
    .container {
      position: relative; z-index: 1;
      width: 100%; max-width: 560px;
      display: grid; grid-template-columns: 1fr; gap: 4px;
      justify-items: center;
    }
    .col { display: flex; flex-direction: column; align-items: center; width: 100%; }

    /* Roomier screens get a bigger clock and headline rather than more columns —
       the page only has one thing to say. */
    @media (min-width: 960px) {
      body { padding: 56px 44px; }
      .container { max-width: 620px; }
      :root { --clock: 300px; }
      .four-oh-four { font-size: 40px; }
      .subtitle { font-size: 13.5px; max-width: 440px; }
    }
    @media (min-width: 1500px) {
      :root { --clock: 340px; }
      .container { max-width: 680px; }
      .four-oh-four { font-size: 46px; letter-spacing: 4px; }
    }

    /* ── Brand + session strip ── */
    .top-row {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; flex-wrap: wrap; margin-bottom: 26px;
    }
    .brand {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.30);
      border-radius: 999px; padding: 5px 13px 5px 6px;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .brand-logo {
      width: 21px; height: 21px; background: var(--white); border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-weight: 800; font-size: 9px; color: var(--red);
    }
    .brand-name {
      font-size: 11px; font-weight: 700; letter-spacing: 0.4px; color: var(--white);
    }

    #sessionCard {
      display: none; align-items: center; gap: 9px;
      background: rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.26);
      border-radius: 999px; padding: 5px 14px;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .session-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--white);
      animation: breathe 2s ease-in-out infinite; flex-shrink: 0;
    }
    @keyframes breathe { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .session-pill {
      font-family: var(--mono); font-size: 9px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,0.9);
    }
    .session-timer-big {
      font-family: var(--mono); font-size: 13px; font-weight: 800;
      color: var(--white); letter-spacing: -0.3px;
    }
    .hc-badge {
      display: none; align-items: center;
      font-family: var(--mono); font-size: 9px; font-weight: 800;
      letter-spacing: 1px; text-transform: uppercase;
      color: var(--red); background: var(--white);
      border-radius: 999px; padding: 2px 8px;
    }

    /* ── The clock: big white disc, black numerals ── */
    .clock-wrap {
      position: relative;
      width: var(--clock); height: var(--clock);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 26px;
    }
    /* Countdown ring riding just outside the disc */
    .clock-ring { position: absolute; inset: -18px; transform: rotate(-90deg); }
    /* Dark track so the white progress arc actually reads against it. */
    .clock-ring .track { stroke: rgba(0,0,0,0.26); }
    .clock-ring .arc {
      stroke: var(--white);
      filter: drop-shadow(0 0 6px rgba(255,255,255,0.55));
      transition: stroke-dashoffset 0.9s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .clock-face {
      width: 100%; height: 100%; border-radius: 50%;
      background: var(--face);
      box-shadow:
        0 26px 70px rgba(0,0,0,0.32),
        0 0 0 12px rgba(255,255,255,0.14);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      animation: clock-breathe 5s ease-in-out infinite;
    }
    @keyframes clock-breathe {
      0%,100% { box-shadow: 0 26px 70px rgba(0,0,0,0.32), 0 0 0 12px rgba(255,255,255,0.14); }
      50%     { box-shadow: 0 26px 70px rgba(0,0,0,0.32), 0 0 0 20px rgba(255,255,255,0.07); }
    }
    @media (prefers-reduced-motion: reduce) { .clock-face { animation: none; } }

    .clock-eyebrow {
      font-family: var(--mono); font-size: 9px; font-weight: 700;
      letter-spacing: 1.6px; text-transform: uppercase;
      color: var(--face-sub); margin-bottom: 6px; text-align: center;
    }
    .clock-time {
      font-family: var(--mono); font-size: 62px; font-weight: 800;
      color: var(--face-ink); letter-spacing: -3.5px; line-height: 0.92;
      font-variant-numeric: tabular-nums;
    }
    .clock-cap {
      font-family: var(--mono); font-size: 10px; font-weight: 600;
      color: var(--face-sub); margin-top: 8px; text-align: center;
      padding: 0 26px; line-height: 1.4;
    }
    .clock-face.unlocked .clock-time { color: var(--red-lit); }

    /* ── 404 headline ── */
    .four-oh-four {
      text-align: center; margin-bottom: 8px;
      font-family: var(--mono); font-weight: 800; color: var(--white);
      font-size: 34px; letter-spacing: 3px; line-height: 1;
      text-shadow: 0 3px 22px rgba(0,0,0,0.28);
    }
    .go-work {
      text-align: center; color: var(--white);
      font-size: 14px; font-weight: 700; letter-spacing: 4px;
      text-transform: uppercase; opacity: 0.95; margin-bottom: 6px;
    }
    .subtitle {
      text-align: center; font-size: 12.5px; line-height: 1.55;
      color: rgba(255,255,255,0.92); max-width: 380px; margin: 0 auto 18px;
      white-space: pre-line;
    }
    .subtitle strong { color: var(--white); font-weight: 700; }
    #siteBadgeWrap { display: none; margin-bottom: 18px; }
    #siteBadge {
      display: inline-block;
      background: rgba(0,0,0,0.24); border: 1px solid rgba(255,255,255,0.28);
      border-radius: 999px; padding: 4px 13px;
      font-family: var(--mono); font-size: 10px; font-weight: 600; color: var(--white);
    }

    /* ── The action ribbon: flat, wide, connected segments, round outer corners ──
       One continuous white bar. Segments butt against each other and are split
       by hairlines, so it reads as a single ribbon rather than three buttons.   */
    .ribbon {
      display: flex; width: 100%; margin-bottom: 20px;
      background: var(--face); border-radius: 999px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.26);
      overflow: hidden;
    }
    .ribbon-btn {
      flex: 1 1 0; min-width: 0;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 15px 12px; border: none; background: transparent;
      font-family: var(--sans); font-size: 12.5px; font-weight: 700;
      color: var(--face-ink); cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ribbon-btn + .ribbon-btn { box-shadow: inset 1px 0 0 rgba(200,25,28,0.20); }
    .ribbon-btn:hover:not(:disabled) { background: rgba(200,25,28,0.10); color: var(--red); }
    .ribbon-btn:active:not(:disabled) { background: rgba(200,25,28,0.18); }
    .ribbon-btn:focus-visible { outline: 3px solid var(--face-ink); outline-offset: -3px; }
    /* The earned segment: solid red once the clock hits zero. */
    .ribbon-btn.reward:not(:disabled) { background: var(--red); color: var(--white); }
    .ribbon-btn.reward:not(:disabled):hover { background: var(--red-lit); color: var(--white); }
    .ribbon-btn:disabled {
      color: var(--face-sub); opacity: 0.55; cursor: not-allowed;
      background: rgba(128,128,128,0.10);
    }
    .ribbon-btn svg { flex-shrink: 0; }

    /* ── Success message ── */
    .success-msg {
      display: none; width: 100%;
      background: var(--face); color: var(--face-ink);
      border-radius: 16px; padding: 16px 18px; text-align: center; margin-bottom: 18px;
      box-shadow: 0 14px 36px rgba(0,0,0,0.22);
    }
    .success-msg-title { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
    .success-msg-sub { font-size: 11px; color: var(--red); font-family: var(--mono); }
    /* ── Narrow screens: the ribbon stacks but stays connected ── */
    @media (max-width: 440px) {
      :root { --clock: 216px; }
      .clock-time { font-size: 50px; }
      .four-oh-four { font-size: 27px; letter-spacing: 2px; }
      .ribbon { flex-direction: column; border-radius: 26px; }
      .ribbon-btn + .ribbon-btn { box-shadow: inset 0 1px 0 rgba(200,25,28,0.20); }
    }
  </style>
</head>
<body>

  <!-- Animated background (decorative) -->
  <div class="bg" aria-hidden="true">
    <div class="bg-wash"></div>
    <div class="bg-blob a"></div>
    <div class="bg-blob b"></div>
    <div class="bg-stripes"></div>
    <div class="bg-grain"></div>
  </div>

  <div class="container">

    <!-- Left: identity, clock, headline, actions -->
    <div class="col col-main">

    <div class="top-row">
      <div class="brand">
        <div class="brand-logo">CF</div>
        <span class="brand-name">CF FOCUS</span>
      </div>
      <div id="sessionCard">
        <span class="session-dot"></span>
        <span class="session-pill">Session</span>
        <span class="session-timer-big" id="sessionTimerBig">--:--</span>
        <span class="hc-badge" id="hcBadge">Hardcore</span>
      </div>
    </div>

    <!-- The clock -->
    <div class="clock-wrap">
      <svg class="clock-ring" viewBox="0 0 302 302">
        <circle class="track" cx="151" cy="151" r="147" fill="none" stroke-width="7"/>
        <circle class="arc" id="clockArc" cx="151" cy="151" r="147" fill="none" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="923.63" stroke-dashoffset="923.63"/>
      </svg>
      <div class="clock-face" id="clockFace">
        <div class="clock-eyebrow" id="clockEyebrow">Locked for</div>
        <div class="clock-time" id="clockTime">--:--</div>
        <div class="clock-cap" id="clockCap">open a practice tab to start the clock</div>
      </div>
    </div>

    <!-- Headline -->
    <div class="four-oh-four">404 NOT FOUND</div>
    <div class="go-work">Go and work</div>
    <p class="subtitle" id="subText">This page is gone until you&rsquo;ve done the thinking.</p>
    <div id="siteBadgeWrap"><span id="siteBadge"></span></div>

    <!-- Connected action ribbon -->
    <div class="ribbon" id="actions">
      <button class="ribbon-btn" id="goBackBtn">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
          <path d="M10 12.5L5.5 8 10 3.5" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back to problem
      </button>
      <button class="ribbon-btn" id="solvedBtn">I solved it</button>
      <button class="ribbon-btn reward" id="unlockAiBtn" disabled>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="11" width="18" height="11" rx="3" stroke="currentColor" stroke-width="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span id="unlockAiBtnLabel">Unlock AI</span>
      </button>
    </div>

    <div class="success-msg" id="successMsg">
      <div class="success-msg-title" id="successTitle">Problem marked as solved!</div>
      <div class="success-msg-sub" id="successSub">Redirecting&hellip;</div>
    </div>

    </div><!-- /col-main -->

  </div>

  <script src="blocked.js"></script>
</body>
</html>

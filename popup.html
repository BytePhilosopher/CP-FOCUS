<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CF Focus</title>
  <script src="theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Dark theme (default) ───────────────────────────── */
    :root {
      --bg:    #0b0b0d;
      --s1:    #141418;
      --s2:    #1c1c21;
      --b1:    #26262c;
      --b2:    #34343c;
      --red:   #e0393c;
      --red-d: rgba(224,57,60,0.12);
      --red-m: rgba(224,57,60,0.32);
      /* Text: high contrast throughout — no dim grays. */
      --text:  #ffffff;
      --text2: #d2d2da;
      --muted: #9a9aa6;
      --dim:   rgba(255,255,255,0.08);
      --track: #2a2a31;
      --solid:    #ffffff;
      --solid-h:  #e8e8e8;
      --on-solid: #101014;
      --sh4: rgba(0,0,0,0.5);
      --mono:  'JetBrains Mono', ui-monospace, monospace;
      --sans:  'Inter', system-ui, sans-serif;
    }

    /* ── Light theme ─────────────────────────────────────
       theme.js always stamps a concrete data-theme, so a single
       override block covers both "chose light" and "system is light". */
    :root[data-theme="light"] {
      --bg:    #ffffff;
      --s1:    #f6f6f8;
      --s2:    #ededf1;
      --b1:    #e2e2e8;
      --b2:    #cfcfd7;
      --red:   #c8191c;
      --red-d: rgba(200,25,28,0.08);
      --red-m: rgba(200,25,28,0.30);
      --text:  #0f0f12;
      --text2: #3c3c45;
      --muted: #63636f;
      --dim:   rgba(0,0,0,0.05);
      --track: #e6e6ec;
      --solid:    #14141a;
      --solid-h:  #000000;
      --on-solid: #ffffff;
      --sh4: rgba(0,0,0,0.14);
    }

    body {
      width: 292px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 12px;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────── */
    .header {
      height: 40px; padding: 0 12px;
      display: flex; align-items: center; gap: 7px;
      border-bottom: 1px solid var(--b1);
    }
    .logo {
      width: 22px; height: 22px; background: var(--red); border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-weight: 800; font-size: 9px;
      color: #fff; flex-shrink: 0; letter-spacing: -0.5px;
    }
    .header-title {
      flex: 1; font-size: 12.5px; font-weight: 700;
      color: var(--text); letter-spacing: -0.3px;
    }
    .header-streak {
      display: flex; align-items: center; gap: 4px;
      font-family: var(--mono); font-size: 10px; font-weight: 700;
      color: var(--text2); padding: 2px 7px;
      background: var(--dim); border-radius: 100px;
    }
    .header-streak-num { color: var(--text); }
    .icon-btn {
      width: 24px; height: 24px; background: transparent;
      border: 1px solid var(--b1); border-radius: 7px;
      color: var(--text2); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.15s;
    }
    .icon-btn:hover { background: var(--s1); border-color: var(--b2); color: var(--text); }

    /* ── Status bar ─────────────────────────────────────── */
    .status-bar {
      padding: 8px 12px;
      display: flex; align-items: center; gap: 9px;
      border-bottom: 1px solid var(--b1);
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      flex-shrink: 0; transition: all 0.3s;
    }
    .status-dot.active  { background: var(--red); box-shadow: 0 0 8px var(--red-m); animation: pulse 2s ease-in-out infinite; }
    .status-dot.session { background: var(--red); box-shadow: 0 0 8px var(--red-m); animation: pulse 2s ease-in-out infinite; }
    .status-dot.snoozed { background: var(--muted); }
    .status-dot.inactive{ background: var(--muted); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .status-label {
      flex: 1; min-width: 0;
      font-size: 11.5px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .status-badge {
      font-family: var(--mono); font-size: 8.5px; font-weight: 700;
      letter-spacing: 0.6px; text-transform: uppercase;
      padding: 2px 7px; border-radius: 100px; flex-shrink: 0;
    }
    .status-badge.active,
    .status-badge.session { background: var(--red-d); color: var(--red); border: 1px solid var(--red-m); }
    .status-badge.snoozed { background: var(--dim); color: var(--text2); border: 1px solid var(--b1); }
    .status-badge.inactive{ background: var(--dim); color: var(--text2); border: 1px solid var(--b1); }

    /* ── Flame ring ─────────────────────────────────────────
       popup.js sets --heat (0 → 1) on .ring-wrap. Everything below scales off
       it, so the whole clock — arc, dial and numerals — burns hotter together
       instead of only the flame changing. */
    .hero { padding: 12px 12px 8px; text-align: center; }
    .ring-wrap {
      display: inline-block; position: relative; line-height: 0;
      --heat: 0;
    }
    /* Scorch bloom inside the dial */
    .ring-wrap::before {
      content: ''; position: absolute; inset: 26px; border-radius: 50%;
      background: radial-gradient(circle,
        rgba(255,45,26, calc(var(--heat) * 0.26)) 0%,
        rgba(255,45,26, calc(var(--heat) * 0.10)) 45%,
        transparent 72%);
      pointer-events: none; z-index: 0;
      transition: background 0.6s ease;
    }
    /* The flame's glow reaches past the ring — let it, rather than
       clipping it into a hard rectangular edge at the viewBox border. */
    .ring-wrap svg { overflow: visible; }
    /* The un-burnt part of the dial chars as the fire comes round. */
    #ringTrack {
      stroke: color-mix(in srgb, var(--track), #3a0f0b calc(var(--heat) * 55%));
      transition: stroke 0.6s ease;
    }
    #ringProgress {
      transition: stroke-dashoffset 0.6s cubic-bezier(0.4,0,0.2,1), filter 0.6s ease;
      filter: drop-shadow(0 0 calc(var(--heat) * 10px) rgba(255,45,26, calc(var(--heat) * 0.75)));
    }

    /* The flame rides the tip of the arc and burns hotter as time adds up. */
    #flame { transition: opacity 0.5s ease; transform-box: view-box; }
    #flameBody { animation: flicker 1.6s ease-in-out infinite; transform-origin: 0 6px; }
    #flameCore { animation: flicker-core 1.1s ease-in-out infinite; transform-origin: 0 4px; }
    @keyframes flicker {
      0%,100% { transform: scaleY(1)    scaleX(1);    }
      35%     { transform: scaleY(1.13) scaleX(0.93); }
      65%     { transform: scaleY(0.93) scaleX(1.06); }
    }
    @keyframes flicker-core {
      0%,100% { transform: scaleY(1)   scaleX(1);   opacity: 0.95; }
      50%     { transform: scaleY(1.2) scaleX(0.9); opacity: 0.7;  }
    }
    @media (prefers-reduced-motion: reduce) {
      #flameBody, #flameCore { animation: none; }
    }

    .ring-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      line-height: 1; pointer-events: none;
    }
    .ring-eyebrow {
      font-family: var(--mono); font-size: 8px; font-weight: 700;
      letter-spacing: 1.4px; text-transform: uppercase;
      color: color-mix(in srgb, var(--muted), #ff5436 calc(var(--heat) * 55%));
      margin-bottom: 6px; position: relative; z-index: 1;
      transition: color 0.6s ease;
    }
    .ring-time {
      font-family: var(--mono); font-size: 28px; font-weight: 800;
      color: color-mix(in srgb, var(--text), #ff5436 calc(var(--heat) * 62%));
      letter-spacing: -1.4px;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 calc(var(--heat) * 20px) rgba(255,60,32, calc(var(--heat) * 0.65));
      transition: color 0.6s ease, text-shadow 0.6s ease;
      position: relative; z-index: 1;
    }
    .ring-sub {
      font-family: var(--mono); font-size: 9px; font-weight: 600;
      color: color-mix(in srgb, var(--text2), #ff5436 calc(var(--heat) * 50%));
      margin-top: 7px; position: relative; z-index: 1;
      transition: color 0.6s ease;
    }

    /* ── Today's stats ──────────────────────────────────── */
    .today-stats {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 1px; background: var(--b1);
      border-top: 1px solid var(--b1); border-bottom: 1px solid var(--b1);
    }
    .today-stat { background: var(--bg); padding: 8px 6px; text-align: center; }
    .today-stat-val {
      font-family: var(--mono); font-size: 15px; font-weight: 800;
      color: var(--text); letter-spacing: -0.7px; line-height: 1;
    }
    .today-stat-val.red { color: var(--red); }
    .today-stat-lbl {
      font-size: 8px; color: var(--text2); margin-top: 3px;
      font-family: var(--mono); letter-spacing: 0.4px; text-transform: uppercase;
    }

    /* ── Actions ────────────────────────────────────────── */
    .actions { padding: 10px 12px 11px; display: flex; flex-direction: column; gap: 7px; }
    .start-btn {
      width: 100%; padding: 11px; background: var(--solid); border: none;
      border-radius: 9px; color: var(--on-solid); font-family: var(--sans);
      font-size: 12px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      transition: background 0.15s, transform 0.1s; letter-spacing: -0.1px;
    }
    .start-btn:hover { background: var(--solid-h); }
    .start-btn:active { transform: scale(0.98); }
    .start-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .snooze-btn {
      width: 100%; padding: 8px; background: transparent;
      border: 1px solid var(--b1); border-radius: 9px;
      color: var(--text2); cursor: pointer; font-family: var(--sans);
      font-size: 11px; font-weight: 600; transition: all 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .snooze-btn:hover { background: var(--s1); border-color: var(--red-m); color: var(--red); }
    .snooze-btn:active { transform: scale(0.98); }
    .snooze-btn.end-snooze { background: var(--red-d); border-color: var(--red-m); color: var(--red); }
    #snoozeRow { display: none; }

    /* Legacy focus session, if one is still running from a previous version. */
    #sessionActive { display: none; }
    .end-btn {
      width: 100%; padding: 8px; background: transparent;
      border: 1px solid var(--red-m); border-radius: 9px;
      color: var(--red); font-family: var(--sans);
      font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .end-btn:hover { background: var(--red-d); }
    .end-btn.confirming { background: var(--red-d); box-shadow: 0 0 0 3px var(--red-d); }
    .end-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">CF</div>
    <span class="header-title">CF Focus</span>
    <div class="header-streak" id="streakBadge" title="Current day streak">
      <svg width="10" height="10" viewBox="0 0 16 16" fill="none">
        <path d="M8 1C8 1 3 6 3 10a5 5 0 0 0 10 0C13 6 8 1 8 1Z" stroke="currentColor" stroke-width="1.4" fill="none"/>
      </svg>
      <span class="header-streak-num" id="streakNum">0</span>d
    </div>
    <button class="icon-btn" id="themeBtn" title="Theme">
      <svg id="themeIcon" width="13" height="13" viewBox="0 0 20 20" fill="none"></svg>
    </button>
    <button class="icon-btn" id="settingsBtn" title="Settings">
      <svg width="13" height="13" viewBox="0 0 20 20" fill="none">
        <path d="M10 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" stroke="currentColor" stroke-width="1.5"/>
        <path d="M17.3 8.3 16 7.6l.5-1.5-2.2-1.3-1 1.2-1.4-.4-.5-1.6H9l-.5 1.6-1.4.4-1-1.2L3.9 6.1l.5 1.5-1.3.7v2.4l1.3.7-.5 1.5L6 14.2l1-1.2 1.4.4.5 1.6h2.4l.5-1.6 1.4-.4 1 1.2 2.2-1.3-.5-1.5 1.3-.7V8.3Z" stroke="currentColor" stroke-width="1.3"/>
      </svg>
    </button>
  </div>

  <div class="status-bar">
    <div class="status-dot inactive" id="statusDot"></div>
    <div class="status-label" id="statusLabel">No practice tab open</div>
    <div class="status-badge inactive" id="statusBadge">Idle</div>
  </div>

  <!-- Count-up focus clock with a flame that grows as the time adds up -->
  <div class="hero">
    <div class="ring-wrap">
      <svg width="180" height="180" viewBox="0 0 200 200">
        <defs>
          <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   id="arcStop1" stop-color="#8f1114"/>
            <stop offset="100%" id="arcStop2" stop-color="#e0202a"/>
          </linearGradient>
          <radialGradient id="flameGlow">
            <stop offset="0%"   stop-color="#ff2d1a" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#ff2d1a" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <circle id="ringTrack" cx="100" cy="100" r="72" fill="none" stroke-width="13"/>
        <circle id="ringProgress" cx="100" cy="100" r="72"
          fill="none" stroke="url(#arcGrad)" stroke-width="13"
          stroke-dasharray="452.39" stroke-dashoffset="452.39"
          stroke-linecap="round" transform="rotate(-90 100 100)"/>

        <!-- Positioned by popup.js at the leading tip of the arc -->
        <g id="flame" opacity="0">
          <circle id="flameHalo" cx="0" cy="0" r="26" fill="url(#flameGlow)"/>
          <g id="flameBody">
            <path d="M0,-14 C4,-8 10,-6 10,2 C10,8.6 5.5,13 0,13 C-5.5,13 -10,8.6 -10,2 C-10,-4 -3,-6 0,-14 Z"
              fill="#d81c1c"/>
          </g>
          <g id="flameCore">
            <path d="M0,-6 C2.5,-2.5 5,-1 5,3 C5,6.6 2.8,9 0,9 C-2.8,9 -5,6.6 -5,3 C-5,0 -1.5,-2 0,-6 Z"
              fill="#ff8a5c"/>
          </g>
        </g>
      </svg>

      <div class="ring-center">
        <div class="ring-eyebrow" id="ringEyebrow">Focus Time</div>
        <div class="ring-time" id="ringTime">0:00:00</div>
        <div class="ring-sub" id="ringSub">Goal 2h</div>
      </div>
    </div>
  </div>

  <div class="today-stats">
    <div class="today-stat">
      <div class="today-stat-val" id="todayTime">0m</div>
      <div class="today-stat-lbl">Focused</div>
    </div>
    <div class="today-stat">
      <div class="today-stat-val red" id="todayBlocks">0</div>
      <div class="today-stat-lbl">Resisted</div>
    </div>
    <div class="today-stat">
      <div class="today-stat-val" id="todaySolved">0</div>
      <div class="today-stat-lbl">Solved</div>
    </div>
  </div>

  <div class="actions">
    <button class="start-btn" id="startFocusBtn">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
        <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span id="startFocusLabel">Start Focus Tab</span>
    </button>

    <div id="sessionActive">
      <button class="end-btn" id="endSessionBtn">End Session</button>
    </div>

    <div id="snoozeRow">
      <button class="snooze-btn" id="snoozeBtn">
        <svg width="11" height="11" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.4"/>
          <path d="M8 4.5V8l2.5 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        Snooze 15m
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
